name: Build Ithann Noise Killer VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DJUCE_DIR="${{ github.workspace }}/JUCE/lib/cmake/JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ithann-Noise-Killer-Windows-VST3
          path: build/IthannNoiseKiller_artefacts/Release/VST3/
          if-no-files-found: error
